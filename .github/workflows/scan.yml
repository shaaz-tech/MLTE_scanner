name: Market Scanner

on:
  schedule:
    # Runs every 15 minutes, all day, every day (UTC cron — the script
    # itself checks IST market hours internally and skips the NSE portion
    # outside 9:15-15:30 IST Mon-Fri; the crypto portion always runs).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # safety cap so a hung run doesn't eat your Action minutes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
